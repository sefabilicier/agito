<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}" />
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Person Job Life Management</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .table-container {
            margin: 50px;
            padding: 10px;
        }

        .header {
            margin-top: 20px;
            padding: 10px;
            justify-items: center;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table thead th {
            color: white;
            text-align: center;
        }

        .table thead{
            background-color: #4b0099;
        }

        .table:hover td:hover{
            background-color: rgba(5, 41, 158, 0.29);
        }

        .table tbody td {
            text-align: center;
            vertical-align: middle;
        }

        .table tbody tr:nth-child(odd) {
            background-color: #f5f5f5;
        }

        .table tbody {
            background-color: #e8e8e8;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

    </style>
</head>
<body>
<div class="is-widescreen is-centered">
    <header class="header">
        <h1 class="title">Person Job Life Management</h1>
    </header>
    <main class="table-container">
        <table class="table is-bordered is-striped is-hoverable is-fullwidth">
            <thead>
            <tr>
                <th>Job Title</th>
                <th>Department</th>
                <th>Employment Type</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="job : ${jobs}">
                <td th:text="${job.getJobTitle()}"></td>
                <td th:text="${job.getDepartment()}">
                <td th:text="${job.getEmploymentType()}">
            </tbody>
        </table>
        <p>Data available: <span th:text="${#lists.size(jobs)}"></span></p>
    </main>

</div>
<script>
    document.addEventListener(
        "DOMContentLoaded", function()
        {document.body.classList.add('loaded');
        });
</script>
</body>

</html>
