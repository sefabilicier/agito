<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Customer Debit Card Add</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099;
            border-color: transparent;
            color: white;
        }

        .button.is-primary:hover {
            background-color: #9400D3;
        }

        .help {
            color: red;
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Create a Customer Debit Card</h1>
    </header>
    <main class="container is-max-tablet">
        <form
                class="form-container is-centered"
                action="/ui/customer-debit-card/add"
                th:action="@{/ui/customer-debit-card/add}"
                th:object="${customerDebitCardDTO}"
                method="post"
        >
            <input type="hidden" th:field="${customerDebitCardDTO.debitCardID}">
            <input type="hidden" th:name="customerId" th:field="${customerId}">

            <div class="field">
                <label class="label">Card Number</label>
                <div class="control">
                    <input class="input" type="text" placeholder="1111-2222-3333-4444"
                           th:field="${customerDebitCardDTO.cardNumber}">
                </div>
                <div th:if="${#fields.hasErrors('cardNumber')}" class="help is-danger">
                    <span th:errors="*{cardNumber}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Card Holder Name</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Alex Mark"
                           th:field="${customerDebitCardDTO.cardHolderName}">
                </div>
                <div th:if="${#fields.hasErrors('cardHolderName')}" class="help is-danger">
                    <span th:errors="*{cardHolderName}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Expiration Date</label>
                <div class="control">
                    <input class="input" type="date" placeholder="11-2026"
                           th:field="${customerDebitCardDTO.expirationDate}">
                </div>
                <div th:if="${#fields.hasErrors('expirationDate')}" class="help is-danger">
                    <span th:errors="*{expirationDate}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Issuer</label>
                <div class="control">
                    <div class="select">
                        <select th:field="*{issuer}">
                            <option th:each="issuerName : ${issuer}"
                                    th:value="${issuerName.issuer}"
                                    th:text="${issuerName.issuer}"></option>
                        </select>
                    </div>
                </div>
                <div th:if="${#fields.hasErrors('issuer')}" class="help is-danger">
                    <span th:errors="*{issuer}"></span>
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button type="submit" class="button is-primary">Next</button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add('loaded');
    });
</script>
</body>
</html>
