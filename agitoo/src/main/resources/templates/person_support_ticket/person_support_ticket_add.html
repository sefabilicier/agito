<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Person Support Ticket Add</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099;
            border-color: transparent;
            color: white;
        }

        .button.is-primary:hover {
            background-color: #9400D3;
        }

        .error {
            color: red;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Create a Person Support Ticket</h1>
    </header>
    <main class="container is-max-tablet">
        <form
                class="form-container is-centered"
                action="/ui/person-support-ticket/add"
                th:action="@{/ui/person-support-ticket/add}"
                th:object="${personSupportTicketDTO}"
                method="post"
                th:novalidate
        >

            <input type="hidden" th:field="*{ticketID}">
            <input type="hidden" th:name="personId" th:field="*{personId}">

            <div class="field">
                <label class="label">Subject</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Subject" th:field="*{subject}" required>
                </div>
                <div th:if="${#fields.hasErrors('subject')}" class="error">
                    <span th:errors="*{subject}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Description</label>
                <div class="control">
                    <textarea class="input" placeholder="Description" th:field="*{description}" required></textarea>
                </div>
                <div th:if="${#fields.hasErrors('description')}" class="error">
                    <span th:errors="*{description}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Status</label>
                <div class="control">
                    <div class="select" required>
                        <select th:field="*{status}">
                            <option value="" disabled selected>Select status</option>
                            <option th:each="stat : ${status}"
                                    th:value="${stat}"
                                    th:text="${stat}"></option>
                        </select>
                    </div>
                </div>
                <div th:if="${#fields.hasErrors('status')}" class="error">
                    <span th:errors="*{status}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Created Date</label>
                <div class="control">
                    <input class="input" type="date" th:field="*{createdDate}" required>
                </div>
                <div th:if="${#fields.hasErrors('createdDate')}" class="error">
                    <span th:errors="*{createdDate}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Resolved Date</label>
                <div class="control">
                    <input class="input" type="date" th:field="*{resolvedDate}">
                </div>
                <div th:if="${#fields.hasErrors('resolvedDate')}" class="error">
                    <span th:errors="*{resolvedDate}"></span>
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button type="submit" class="button is-primary">Next</button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add('loaded');
    });
</script>
</body>
</html>
