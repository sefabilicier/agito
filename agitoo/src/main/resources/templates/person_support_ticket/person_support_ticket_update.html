<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Person Support Ticket Update</title>
    <style>

        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .title {
            color: #ffffff;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099; /* Button background color */
            border-color: transparent;
            color: white; /* Button text color */
        }

        .button.is-primary:hover {
            background-color: #9400D3;
            /*background-color: #1E00FF;  Button hover color */
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Update the person support ticket</h1>
    </header>
    <main class="container is-max-tablet">
        <form

                action="@{/ui/ui/person-support-ticket/update/{ticketID}/edit(ticketID=${personSupportTicketDTO.ticketID})}"
                th:action="@{/ui/ui/person-support-ticket/update/{ticketID}/edit(ticketID=${personSupportTicketDTO.ticketID})}"
                th:object="${personSupportTicketDTO}"
                method="post"
        >
            <input type="hidden" th:field="${personSupportTicketDTO.ticketID}">

            <div class="field">
                <label class="label">Ticket Number</label>
                <div class="control">
                    <input class="input" type="text" placeholder="0001"
                           th:field="${personSupportTicketDTO.ticketNumber}">
                </div>
            </div>
            <div class="field">
                <label class="label">Subject</label>
                <div class="control">
                    <input class="input" type="text" placeholder="subject" th:field="${personSupportTicketDTO.subject}">
                </div>
            </div>
            <div class="field">
                <label class="label">Description</label>
                <div class="control">
                    <input class="input" type="text" placeholder="description"
                           th:field="${personSupportTicketDTO.description}">
                </div>
            </div>
            <div class="field">
                <label class="label">Description</label>
                <div class="control">
                    <input class="input" type="text" placeholder="description"
                           th:field="${personSupportTicketDTO.description}">
                </div>
            </div>
            <div class="field">
                <label class="label">Status</label>
                <div class="control">
                    <div class="select">
                        <select th:field="*{status}">
                            <option th:each="stats : ${status}"
                                    th:value="${stats.status}"
                                    th:text="${stats.status}">
                            </option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="field">
                <label class="label">Created Date</label>
                <div class="control">
                    <input class="input" type="date" placeholder="13.12.2024"
                           th:field="${personSupportTicketDTO.createdDate}">
                </div>
            </div>
            <div class="field">
                <label class="label">Resolved Date</label>
                <div class="control">
                    <input class="input" type="date" placeholder="13.12.2024"
                           th:field="${personSupportTicketDTO.resolvedDate}">
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button
                            type="submit"
                            class="button is-primary"
                            th:href="'http://localhost:8080/ui/person-support-ticket/update'"
                    >
                        Update
                    </button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener(
        "DOMContentLoaded", function () {
            document.body.classList.add('loaded');
        });
</script>
</body>
</html>
