<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Customer Contact Add</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099;
            border-color: transparent;
            color: white;
        }

        .button.is-primary:hover {
            background-color: #9400D3;
        }

        .help {
            color: red;
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Create a Customer Contact</h1>
    </header>
    <main class="container is-max-tablet">
        <form
                class="form-container is-centered"
                action="/ui/customer-contact/add"
                th:action="@{/ui/customer-contact/add}"
                th:object="${customerContactDTO}"
                method="post"
        >
            <input type="hidden" th:field="${customerContactDTO.contactID}">
            <input type="hidden" th:name="customerId" th:field="${customerId}">

            <div class="field">
                <label class="label">Contact Name</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Alex Mark"
                           th:field="${customerContactDTO.contactName}">
                </div>
                <div th:if="${#fields.hasErrors('contactName')}" class="help is-danger">
                    <span th:errors="*{contactName}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Contact Type</label>
                <div class="control">
                    <div class="select">
                        <select th:field="*{contactType}">
                            <option th:each="type : ${contactType}"
                                    th:value="${type.customerContact}"
                                    th:text="${type.customerContact}"></option>
                        </select>
                    </div>
                </div>
                <div th:if="${#fields.hasErrors('contactType')}" class="help is-danger">
                    <span th:errors="*{contactType}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">E-Mail</label>
                <div class="control">
                    <input class="input" type="email" placeholder="someone@agito.com.tr"
                           th:field="${customerContactDTO.email}">
                </div>
                <div th:if="${#fields.hasErrors('email')}" class="help is-danger">
                    <span th:errors="*{email}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Phone</label>
                <div class="control">
                    <input class="input" type="text" placeholder="+905456667788" th:field="${customerContactDTO.phone}">
                </div>
                <div th:if="${#fields.hasErrors('phone')}" class="help is-danger">
                    <span th:errors="*{phone}"></span>
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button type="submit" class="button is-primary">Next</button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add('loaded');
    });
</script>
</body>
</html>
