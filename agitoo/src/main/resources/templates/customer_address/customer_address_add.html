<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Customer Address Add</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099;
            border-color: transparent;
            color: white;
        }

        .button.is-primary:hover {
            background-color: #9400D3;
        }

        .help {
            color: red;
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Create a Customer Address</h1>
    </header>
    <main class="container is-max-tablet">
        <form
                class="form-container is-centered"
                action="/ui/customer-address/add"
                th:action="@{/ui/customer-address/add}"
                th:object="${customerAddressDTO}"
                method="post"
        >
            <input type="hidden" th:field="*{addressID}">
            <input type="hidden" th:name="customerAddressCityId" th:field="customerAddressCityId">
            <input type="hidden" th:name="customerAddressCountryId" th:field="customerAddressCountryId">

            <div class="field">
                <label class="label">Address Type</label>
                <div class="control">
                    <div class="select">
                        <select th:field="*{addressType}">
                            <option th:each="addressType : ${addressType}"
                                    th:value="${addressType}"
                                    th:text="${addressType}"></option>
                        </select>
                    </div>
                </div>
                <div th:if="${#fields.hasErrors('addressType')}" class="help is-danger">
                    <p th:errors="*{addressType}"></p>
                </div>
            </div>

            <div class="field">
                <label class="label">Address Line 1</label>
                <div class="control">
                    <input class="input" type="text" placeholder="First Address Line"
                           th:field="${customerAddressDTO.addressLine1}">
                </div>
                <div th:if="${#fields.hasErrors('addressLine1')}" class="help is-danger">
                    <span th:errors="*{addressLine1}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Address Line 2</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Second Address Line"
                           th:field="${customerAddressDTO.addressLine2}">
                </div>
                <div th:if="${#fields.hasErrors('addressLine2')}" class="help is-danger">
                    <span th:errors="*{addressLine2}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Postal Code</label>
                <div class="control">
                    <input class="input" type="text" placeholder="34301" th:field="${customerAddressDTO.postalCode}">
                </div>
                <div th:if="${#fields.hasErrors('postalCode')}" class="help is-danger">
                    <span th:errors="*{postalCode}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Default</label>
                <div class="control">
                    <div class="select">
                        <select th:field="*{isDefault}">
                            <option th:each="defaults : ${default}"
                                    th:value="${defaults}"
                                    th:text="${defaults}"></option>
                        </select>
                    </div>
                </div>
                <div th:if="${#fields.hasErrors('isDefault')}" class="help is-danger">
                    <span th:errors="*{isDefault}"></span>
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button type="submit" class="button is-primary">Next</button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add('loaded');
    });
</script>
</body>
</html>
