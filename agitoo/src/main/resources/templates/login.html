<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Login</title>
    <style>
        body {
            color: black;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 1px;
        }

        .title {
            color: black; /* Title color */
        }

        .input {
            border: 1px solid #ddd;
        }

        .input:focus {
            box-shadow: none; /* Remove default shadow */
        }

        .button {
            border: 1px solid #ddd;
        }

        .button.is-primary {
            background-color: #4b0099; /* Button background color */
            #border-color: transparent;
            color: white; /* Button text color */
        }

        .button.is-primary:hover {
            background-color: #9400D3; /* Button hover color */
        }

        .field {
            margin-bottom: 20px;
        }

        .checkbox label {
            color: black; /* Checkbox label color */
        }

        .control {
            border-radius: 1px;
        }

    </style>
</head>
<body>
<div class="login-container">
    <h2 class="is-size-4 is-centered" style="color:white">agito security via spring</h2>
    <form method="post" action="/login">
        <div class="field">
            <label class="label" for="username">Username</label>
            <div class="control">
                <input
                        type="text"
                        id="username"
                        name="username"
                        class="input"
                        placeholder="Username"
                        required autofocus
                        style="border-radius:1px"

                >
            </div>
        </div>
        <div class="field">
            <label class="label" for="password">Password</label>
            <div class="control">
                <input
                        type="password"
                        id="password"
                        name="password"
                        class="input"
                        placeholder="Password"
                        required
                        style="border-radius:1px">
            </div>
        </div>
        <div class="field">
            <div class="control">
                <label class="checkbox">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    Remember me?
                </label>
            </div>
        </div>
        <div class="field">
            <div class="control">
                <button
                        class="button is-primary is-fullwidth"
                        type="submit"
                        style="border-radius:1px"
                >
                    Login
                </button>
            </div>
        </div>
    </form>
</div>
<script>
    document.addEventListener(
        "DOMContentLoaded", function () {
            document.body.classList.add('loaded');
        });
</script>
</body>
</html>
