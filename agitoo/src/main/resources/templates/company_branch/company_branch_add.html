<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Company Add</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099;
            border-color: transparent;
            color: white;
        }

        .button.is-primary:hover {
            background-color: #9400D3;
        }

        .help {
            color: red;
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Create a Company Branch</h1>
    </header>
    <main class="container is-max-tablet">
        <form
                class="form-container is-centered"
                action="/ui/company-branch/add"
                th:action="@{/ui/company-branch/add}"
                th:object="${companyBranchDTO}"
                method="post"
        >

            <input type="hidden" th:field="*{branchID}">
            <input type="hidden" th:name="companyId" th:field="${companyId}">

            <div class="field">
                <label class="label">Branch Name</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Headquarter"
                           th:field="${companyBranchDTO.branchName}">
                </div>
                <div th:if="${#fields.hasErrors('branchName')}" class="help is-danger">
                    <span th:errors="*{branchName}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Branch Address</label>
                <div class="control">
                    <input class="input" type="text" placeholder="ITU ARI Tekno Kent ARI-2 Building 4th floor B21"
                           th:field="${companyBranchDTO.branchAddress}">
                </div>
                <div th:if="${#fields.hasErrors('branchAddress')}" class="help is-danger">
                    <span th:errors="*{branchAddress}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Branch Phone</label>
                <div class="control">
                    <input class="input" type="text" placeholder="+902123334455"
                           th:field="${companyBranchDTO.branchPhone}">
                </div>
                <div th:if="${#fields.hasErrors('branchPhone')}" class="help is-danger">
                    <span th:errors="*{branchPhone}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Branch Manager</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Manager Name"
                           th:field="${companyBranchDTO.branchManager}">
                </div>
                <div th:if="${#fields.hasErrors('branchManager')}" class="help is-danger">
                    <span th:errors="*{branchManager}"></span>
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button
                            type="submit"
                            class="button is-primary"
                            th:href="'http://localhost:8080/ui/company-financial/add'"
                    >
                        Next
                    </button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener(
        "DOMContentLoaded", function () {
            document.body.classList.add('loaded');
        });
</script>
</body>
</html>
