<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Person Feedback Add</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099;
            border-color: transparent;
            color: white;
        }

        .button.is-primary:hover {
            background-color: #9400D3;
        }

        /* Range input styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #bfbebe;
            border-radius: 0;
            outline: none;
            opacity: 0.8;
            transition: opacity .2s;
        }

        input[type="range"]:hover {
            opacity: 1;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 8px;
            background: #4b0099;
            border-radius: 0;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 8px;
            background: #4b0099;
            border-radius: 0;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Create a Person Feedback</h1>
    </header>
    <main class="container is-max-tablet">
        <form
                class="form-container is-centered"
                action="/ui/person-feedback/add"
                th:action="@{/ui/person-feedback/add}"
                th:object="${personFeedbackDTO}"
                method="post"
                th:novalidate
        >
            <input type="hidden" th:field="*{feedbackId}">
            <input type="hidden" th:name="personId" th:value="*{personId}"/>

            <div class="field">
                <label class="label">Feedback Date</label>
                <div class="control">
                    <input class="input" type="datetime-local" th:field="*{feedbackDate}" required>
                </div>
            </div>

            <div class="field">
                <label class="label">Feedback Type</label>
                <div class="control">
                    <div class="select">
                        <select th:field="*{feedbackType}" required>
                            <option value="" disabled selected>Select feedback type</option>
                            <option th:each="feedback : ${feedbackTypes}"
                                    th:value="${feedback}"
                                    th:text="${feedback}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label">Rate (between 1 and 5)</label>
                <div class="control">
                    <input
                            th:field="*{rating}"
                            type="range" min="1" max="5"
                            th:value="${personFeedbackDTO.rating}"
                            list="values"
                            onchange="updateOutput(this.value)"
                    >
                    <datalist id="values">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </datalist>

                    <output id="ratingOutput" th:text="${personFeedbackDTO.rating}" style="margin-left: 10px;"></output>
                </div>
            </div>

            <div class="field">
                <label class="label">Comment</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Comment" th:field="*{comments}" required>
                </div>
                <div th:if="${#fields.hasErrors('comments')}" class="error">
                    <span th:errors="*{comments}"></span>
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button type="submit" class="button is-primary">Next</button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add('loaded');
    });

    function updateOutput(value) {
        document.getElementById('ratingOutput').innerText = value;
    }
</script>
</body>
</html>
