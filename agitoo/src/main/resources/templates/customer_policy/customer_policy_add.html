<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Customer Policy Add</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099; /* Button background color */
            border-color: transparent;
            color: white; /* Button text color */
        }

        .button.is-primary:hover {
            background-color: #9400D3; /* Button hover color */
        }

        .error {
            color: red;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Create a Customer Policy</h1>
    </header>
    <main class="container is-max-tablet">
        <form
                class="form-container is-centered"
                action="/ui/customer-policy/add"
                th:action="@{/ui/customer-policy/add}"
                th:object="${customerPolicyDTO}"
                method="post"
                th:novalidate
        >
            <input type="hidden" th:field="${customerPolicyDTO.customerPolicyId}">
            <input type="hidden" th:name="customerId" th:field="customerId">

            <div class="field">
                <label class="label">Policy Number</label>
                <div class="control">
                    <input class="input" type="text" placeholder="549775"
                           th:field="${customerPolicyDTO.customerPolicyNumber}" required>
                </div>
                <div th:if="${#fields.hasErrors('customerPolicyNumber')}" class="error">
                    <span th:errors="*{customerPolicyNumber}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Policy Type</label>
                <div class="control">
                    <div class="select">
                        <select th:field="*{customerPolicyType}" required>
                            <option th:each="policy : ${customerPolicyType}"
                                    th:value="${policy}"
                                    th:text="${policy}"></option>
                        </select>
                    </div>
                </div>
                <div th:if="${#fields.hasErrors('customerPolicyType')}" class="error">
                    <span th:errors="*{customerPolicyType}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Policy Start Date</label>
                <div class="control">
                    <input class="input" type="date" placeholder="13.12.2023"
                           th:field="${customerPolicyDTO.customerPolicyStartDate}" required>
                </div>
                <div th:if="${#fields.hasErrors('customerPolicyStartDate')}" class="error">
                    <span th:errors="*{customerPolicyStartDate}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Policy End Date</label>
                <div class="control">
                    <input class="input" type="date" placeholder="13.12.2024"
                           th:field="${customerPolicyDTO.customerPolicyEndDate}" required>
                </div>
                <div th:if="${#fields.hasErrors('customerPolicyEndDate')}" class="error">
                    <span th:errors="*{customerPolicyEndDate}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Coverage Amount</label>
                <div class="control">
                    <input class="input" type="number" placeholder="15000"
                           th:field="${customerPolicyDTO.coverageAmount}" required>
                </div>
                <div th:if="${#fields.hasErrors('coverageAmount')}" class="error">
                    <span th:errors="*{coverageAmount}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Premium</label>
                <div class="control">
                    <input class="input" type="number" placeholder="7000" th:field="${customerPolicyDTO.premium}"
                           required>
                </div>
                <div th:if="${#fields.hasErrors('premium')}" class="error">
                    <span th:errors="*{premium}"></span>
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button type="submit" class="button is-primary">Next</button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add('loaded');
    });
</script>
</body>
</html>
