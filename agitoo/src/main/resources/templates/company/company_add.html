<!DOCTYPE html>
<html lang="eng" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{/css/bulma.min.css}"/>
    <link href="/static/bulma.css" rel="stylesheet">
    <title>Company Add</title>
    <style>
        body {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .input {
            border-radius: 2px;
        }

        .header {
            margin: 50px;
            padding: 25px;
            background-color: #4b0099;
        }

        .field-2 {
            margin: 20px;
            text-align: center;
        }

        .button {
            border-radius: 2px;
        }

        .button.is-primary {
            background-color: #4b0099;
            border-color: transparent;
            color: white;
        }

        .button.is-primary:hover {
            background-color: #9400D3;
        }

        .help {
            color: red;
        }
    </style>
</head>
<body>
<div class="is-widescreen">
    <header class="header has-text-centered marginless">
        <h1 class="is-size-3 label" style="color:white">Create a Company</h1>
    </header>
    <main class="container is-max-tablet">
        <form
                class="form-container is-centered"
                action="/ui/company/add"
                th:action="@{/ui/company/add}"
                th:object="${companyDTO}"
                method="post"
        >

            <input type="hidden" th:field="${companyDTO.companyId}">
            <input type="hidden" th:name="customerId" th:field="${customerId}">

            <div class="field">
                <label class="label">Company Name</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Agito Software & Consulting Inc."
                           th:field="${companyDTO.companyName}">
                </div>
                <div th:if="${#fields.hasErrors('companyName')}" class="help is-danger">
                    <span th:errors="*{companyName}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Industry</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Technology - Insurance"
                           th:field="${companyDTO.industry}">
                </div>
                <div th:if="${#fields.hasErrors('industry')}" class="help is-danger">
                    <span th:errors="*{industry}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Contact Company</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Contact Name" th:field="${companyDTO.contactCompany}">
                </div>
                <div th:if="${#fields.hasErrors('contactCompany')}" class="help is-danger">
                    <span th:errors="*{contactCompany}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Registration Number</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Reg. Number"
                           th:field="${companyDTO.registrationNumber}">
                </div>
                <div th:if="${#fields.hasErrors('registrationNumber')}" class="help is-danger">
                    <span th:errors="*{registrationNumber}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Tax Identification Number</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Tax ID"
                           th:field="${companyDTO.taxIdentificationNumber}">
                </div>
                <div th:if="${#fields.hasErrors('taxIdentificationNumber')}" class="help is-danger">
                    <span th:errors="*{taxIdentificationNumber}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Established Date</label>
                <div class="control">
                    <input class="input" type="date" th:field="${companyDTO.establishedDate}">
                </div>
                <div th:if="${#fields.hasErrors('establishedDate')}" class="help is-danger">
                    <span th:errors="*{establishedDate}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Number of Employees</label>
                <div class="control">
                    <input class="input" type="number" placeholder="300" th:field="${companyDTO.numberOfEmployees}">
                </div>
                <div th:if="${#fields.hasErrors('numberOfEmployees')}" class="help is-danger">
                    <span th:errors="*{numberOfEmployees}"></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Website URL</label>
                <div class="control">
                    <input class="input" type="url" placeholder="www.agito.com.tr" th:field="${companyDTO.websiteURL}">
                </div>
                <div th:if="${#fields.hasErrors('websiteURL')}" class="help is-danger">
                    <span th:errors="*{websiteURL}"></span>
                </div>
            </div>

            <div class="field-2 field is-grouped is-grouped-centered">
                <p class="control">
                    <button type="submit" class="button is-primary">Next</button>
                </p>
                <p class="control">
                    <a class="button is-light" th:href="'http://localhost:8080/home'">Cancel</a>
                </p>
            </div>
        </form>
    </main>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add('loaded');
    });
</script>
</body>
</html>
